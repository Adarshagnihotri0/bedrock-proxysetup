      - replay
      - constraint

  - query: "embedding vector search"
    description: "Query about embeddings and vector search"
    category: Embedding
    
    relevant:
      - hash: tuv456wxy789  # embedding implementation
      - hash: yz012abc345  # vector similarity
      - hash: def678ghi901  # search optimization
    
    keywords:
      - embedding
      - vector
      - search
      - similarity

  - query: "knowledge retrieval pipeline"
    description: "Query about retrieval pipeline"
    category: Retrieval
    
    relevant:
      - hash: jkl234mno567  # retrieval pipeline
      - hash: pqr890stu123  # query processing
      - hash: tuv456wxy789  # result ranking
    
    keywords:
      - retrieval
      - pipeline
      - query
      - knowledge
