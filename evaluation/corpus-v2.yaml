# Retrieval Evaluation Corpus v2
#
# Purpose: Ground-truth relevance judgments for retrieval evaluation
#
# Philosophy: Corpus describes relevant documents, not ranking buckets.
# Metrics (Top-1, R@5, R@10, MRR, NDCG) computed from same ground truth.
#
# Stable identifiers: Use hash/uuid instead of database-generated IDs
# so benchmarks remain valid after database rebuilds.
#
# Status: Structure ready, needs populated relevance judgments
#
# Usage: npm run evaluate:retrieval-v2

version: v2

queries:
  - query: "canonical serialization replay"
    description: "Query about canonical serialization and replay"
    category: Architecture
    
    # Ground-truth relevant documents (hash/uuid identifiers)
    # TODO: Populate with actual relevant knowledge after manual review
    relevant:
      - hash: abc123def456  # canonical serialization approach
      - hash: def789ghi012  # replay implementation
      - hash: jkl345mno678  # canonical format validation
    
    # Legacy keyword matching (supplementary)
    keywords:
      - canonical
      - serialization
      - replay
      - hash

  - query: "neo4j projection knowledge"
    description: "Query about Neo4j projection"
    category: Architecture
    
    relevant:
      - hash: pqr890stu123  # projection mechanism
      - hash: tuv456wxy789  # knowledge graph design
      - hash: yz012abc345  # neo4j integration
    
    keywords:
      - projection
      - neo4j
      - knowledge
      - graph

  - query: "validation idempotency replay"
    description: "Query about validation and idempotency"
    category: Replay
    
    relevant:
      - hash: def678ghi901  # validation replay
      - hash: jkl234mno567  # idempotency constraints
      - hash: pqr890stu123  # validation guarantees
    
    keywords:
      - validation
