# Retrieval Evaluation Corpus v2
#
# Purpose: Ground-truth relevance judgments for retrieval evaluation
#
# Philosophy: Corpus describes relevant documents, not ranking buckets.
# Metrics (Top-1, R@5, R@10, MRR, NDCG) computed from same ground truth.
#
# Structure:
# - Query ID: Stable identifier for regression tracking
# - Hash: Stable document identifier (survives database rebuilds)
# - Grade: Relevance level (3=highly relevant, 2=somewhat, 1=marginally)
# - Notes: Human-readable context for why this doc is relevant
#
# Status: Structure ready, needs populated relevance judgments
#
# Usage: npm run evaluate:retrieval-v2

version: v2

queries:
  - id: canonical-replay
    query: "canonical serialization replay"
    description: "Query about canonical serialization and replay"
    category: Architecture
    
    relevant:
      - hash: abc123def456
        grade: 3
        notes: "Canonical serialization approach for replay system"
      
      - hash: def789ghi012
        grade: 2
        notes: "Replay implementation details"
      
      - hash: jkl345mno678
        grade: 2
        notes: "Canonical format validation"
    
    keywords:
      - canonical
      - serialization
      - replay
      - hash

  - id: neo4j-projection
    query: "neo4j projection knowledge"
    description: "Query about Neo4j projection"
    category: Architecture
    
