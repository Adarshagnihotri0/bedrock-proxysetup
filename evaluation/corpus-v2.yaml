# Retrieval Evaluation Corpus v2
#
# Purpose: Measure real retrieval metrics (not just keyword overlap)
#
# Metrics we can now compute:
# - Top-1 accuracy: retrieved[0] in expected.top1?
# - Recall@5: |expected.top5 ∩ retrieved[0:5]| / |expected.top5|
# - Recall@10: |expected.top10 ∩ retrieved[0:10]| / |expected.top10|
# - MRR: Mean Reciprocal Rank
# - NDCG: Normalized Discounted Cumulative Gain
#
# Previous limitation:
# - Only measured keyword overlap (weak proxy)
# - Didn't verify actual relevant documents returned
#
# New approach:
# - Specify expected knowledge IDs (or hashes)
# - Measure actual retrieval quality

version: v2

queries:
  - query: "canonical serialization replay"
    description: "Query about canonical serialization and replay"
    category: Architecture
    
    # Expected results (knowledge IDs or hashes)
    # Note: These need to be populated by examining actual data
    expected:
      top1:
        - knowledge_182  # placeholder - update with real ID
        
      top5:
        - knowledge_182
        - knowledge_91
        - knowledge_47
        
      top10:
        - knowledge_182
        - knowledge_91
        - knowledge_47
        - knowledge_23
        - knowledge_15
    
    # Legacy keyword matching (weaker metric)
    keywords:
      - canonical
      - serialization
      - replay
      - hash

